<!DOCTYPE html>
<html lang="fr" data-scene="live">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoopsLive OBS — Live</title>
  <style>
    html, body { margin:0; height:100%; background:transparent; color:#fff;
      font-family:"Segoe UI",system-ui,sans-serif; }
    .stage { min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(900px 500px at 50% 0%, rgba(225,29,72,.28), transparent 65%); }
    #time { font-variant-numeric:tabular-nums; font-size:clamp(3.5rem,12vw,8rem); font-weight:700;
      animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.88} }
    #state { margin-top:.5rem; letter-spacing:.25em; color:#e11d48; text-align:center; }
    .label { text-align:center; letter-spacing:.28em; color:#fecdd3; margin-bottom:.5rem; text-transform:uppercase; }
    #panel { position:fixed; left:12px; bottom:12px; display:flex; flex-wrap:wrap; gap:6px;
      background:rgba(0,0,0,.55); padding:8px; border-radius:8px; }
    #panel[hidden]{display:none!important}
    #panel button{background:#1e293b;color:#fff;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}
  </style>
</head>
<body>
  <main class="stage">
    <div>
      <p class="label">Live</p>
      <div id="time">05:00</div>
      <div id="state">LIVE</div>
    </div>
  </main>
  <div id="panel" hidden></div>
  <script src="../assets/countdown-client.js"></script>
</body>
</html>
