<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Crimsons Press Seal">
  <title>Crimsons - F6 Press Seal</title>
  <defs>
    <linearGradient id="f6g" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E8344A"/>
      <stop offset="100%" stop-color="#6E101C"/>
    </linearGradient>
  </defs>
  <!-- Coin / stamp circular mark -->
  <circle cx="64" cy="64" r="54" fill="#121216"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#f6g)" stroke-width="5"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#E8344A" stroke-width="1.5" opacity="0.55"/>
  <!-- Seal tick marks around the ring (coin edge) -->
  <g stroke="#F0F0F4" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <line x1="64" y1="18" x2="64" y2="24"/>
    <line x1="64" y1="104" x2="64" y2="110"/>
    <line x1="18" y1="64" x2="24" y2="64"/>
    <line x1="104" y1="64" x2="110" y2="64"/>
    <line x1="31" y1="31" x2="35.5" y2="35.5"/>
    <line x1="92.5" y1="92.5" x2="97" y2="97"/>
    <line x1="97" y1="31" x2="92.5" y2="35.5"/>
    <line x1="35.5" y1="92.5" x2="31" y2="97"/>
  </g>
  <!-- Center monogram block -->
  <circle cx="64" cy="64" r="22" fill="url(#f6g)"/>
  <text x="64" y="70" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="22" font-weight="800" letter-spacing="1" fill="#0E0E11">CR</text>
</svg>
