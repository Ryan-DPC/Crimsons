<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Apple Music — En cours</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      color: #eee;
      background: #1a1a1c;
      margin: 12px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .title { font-weight: 700; font-size: 13px; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .badge-connected { background: rgba(34, 197, 94, 0.2); color: #6f6; }
    .badge-disconnected { background: rgba(252, 60, 68, 0.18); color: #fc9aa0; }
    label { display: block; margin-bottom: 6px; opacity: 0.8; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: #fc3c44;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #2b2b36;
      border: 1px solid #3b3b4a;
      color: #ddd;
    }
    p { opacity: 0.65; line-height: 1.4; margin: 0 0 8px; }
    .ok { color: #6f6; opacity: 1; }
    .err { color: #fc9aa0; opacity: 1; }
    #tokenEntry { display: none; margin-top: 8px; }
    #tokenEntry.visible { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Cider</div>
    <span id="badge" class="badge badge-disconnected">Non connecté</span>
  </div>

  <div id="connectedView" class="hidden">
    <p>Jeton Cider enregistré dans Crimsons. Les actions Apple Music sont prêtes.</p>
    <button id="disconnect" class="secondary" type="button">Déconnecter</button>
  </div>

  <div id="disconnectedView">
    <p>Connectez Cider pour afficher le titre en cours et contrôler la lecture.</p>
    <button id="connect" type="button">Connecter</button>
    <div id="tokenEntry">
      <p>Générez un jeton dans Cider&nbsp;: <strong>Settings → Connectivity → Manage Application Access</strong>, scopes Playback + Audio (+ Library).</p>
      <label for="token">Cider <code>apptoken</code></label>
      <input id="token" type="password" placeholder="Coller le jeton ici" autocomplete="off" />
      <button id="save" type="button">Enregistrer dans Crimsons</button>
    </div>
  </div>

  <p id="status"></p>
  <script src="index.js"></script>
</body>
</html>
