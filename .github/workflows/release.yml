name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CACHE_VERSION: v1

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

  publish:
    needs: [build-frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

      - name: Build Sidecar (In-place)
        run: cargo build -p crimson-server --release
        working-directory: apps/desktop/src-tauri

      - name: Prepare Sidecar
        run: |
          mkdir bin
          cp target/release/crimson-server.exe bin/crimson-server-x86_64-pc-windows-msvc.exe
        working-directory: apps/desktop/src-tauri

      - name: Install Tauri CLI
        run: npm ci
        working-directory: apps/desktop
      
      - name: Build Tauri app (Cache only)
        if: github.ref == 'refs/heads/main'
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app (Signed Release)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate Auto-Updater Metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          
          # Extract ONLY the signature line (last line)
          $sig = (Get-Content "$($exe.FullName).sig" | Select-Object -Last 1).Trim()
          
          echo "Generating latest.json for version $v with signature: $sig"
          
          $latest = @{
              version = $v
              notes = "Crimson Update v$v"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                  "windows-x86_64" = @{
                      signature = $sig
                      url = "https://github.com/Ryan-DPC/Crimson/releases/download/v$v/$($exe.Name)"
                  }
              }
          }
          $latest | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/target/release/latest.json" -Encoding utf8


      - name: Release v2.2.0
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 'Crimson ${{ github.ref_name }}'
          tag_name: ${{ github.ref_name }}
          body: |
            ## ⚡ Crimson ${{ github.ref_name }}
            
            Cette version utilise la nouvelle pipeline de signature manuelle (v2.2.0) :
            - **Signature Explicit** : Garantit la génération de `latest.json`.
            - **Auto-Update FIXED** : Plus de dépendance au build-flow automatique capricieux.
            - **Indicateurs de Statut** : SERVER et LEAGUE toujours présents.
            - **Silent Updates** : Désormais via NSIS (Per-User).
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/latest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
