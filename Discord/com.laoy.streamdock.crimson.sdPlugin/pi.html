<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Crimson PI</title>
    <link rel="stylesheet" href="static/css/sdpi.css">
    <style>
        body { background-color: #2d2d2d; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .sdpi-item { padding: 10px; }
        .build-card {
            background: #3d3d3d;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .build-card:hover { border-color: #0078d4; background: #4d4d4d; }
        .build-card.selected { border-color: #00ff00; background: #2d4d2d; }
        .build-name { font-weight: bold; color: #00ff00; font-size: 14px; }
        .build-perks { font-size: 11px; color: #ccc; margin-top: 4px; }
        .loading { text-align: center; padding: 20px; color: #888; }
        select { background: #3d3d3d; color: #fff; border: 1px solid #555; padding: 4px; width: 100%; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div id="pi-content">
        <!-- Content will be injected by pi.js -->
        <div class="loading">Chargement...</div>
    </div>

    <script src="plugin/pi.js"></script>
</body>
</html>
