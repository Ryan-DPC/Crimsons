  <g>
    <rect x="22" y="64" width="12" height="36" rx="3" fill="#3A3A44"/>
    <rect x="40" y="48" width="12" height="52" rx="3" fill="url(#f2b)"/>
    <rect x="58" y="28" width="12" height="72" rx="3" fill="url(#f2c)"/>
    <rect x="76" y="40" width="12" height="60" rx="3" fill="url(#f2a)"/>
    <rect x="94" y="56" width="12" height="44" rx="3" fill="#2A2A32"/>
  </g>
