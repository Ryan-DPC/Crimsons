<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Crimsons Spectrum Bars">
  <title>Crimsons - F2 Spectrum Bars</title>
  <defs>
    <linearGradient id="f2a" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF6B7C"/>
      <stop offset="100%" stop-color="#B31B32"/>
    </linearGradient>
    <linearGradient id="f2b" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E8344A"/>
      <stop offset="100%" stop-color="#7A1222"/>
    </linearGradient>
    <linearGradient id="f2c" x1="50%" y1="0%" x2="50%" y2="100%">
