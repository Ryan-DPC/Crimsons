<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Spotify Controller - Add to Playlist</title>
    <link rel="stylesheet" href="../utils/crimson.css">
</head>
<body>
<div class="sdpi-wrapper">
    <div class="status-pill">
        <div class="status-dot"></div>
        <span>Crimson Relay Active</span>
    </div>

    <div class="section-header">Target Playlist</div>
    <div class="sdpi-item">
        <div class="sdpi-item-label">Playlist</div>
        <select class="sdpi-item-value select" id="playlistId">
            <option value="">Loading...</option>
        </select>
    </div>

    <div class="sdpi-item">
        <div class="sdpi-item-label">Show Cover</div>
        <input type="checkbox" class="sdpi-item-value checkbox" id="showCover" checked>
        <label for="showCover"><span></span></label>
    </div>

    <button id="logoutBtn">Logout</button>
</div>
<script src="../utils/common.js"></script>
<script src="../utils/action.js"></script>
<script src="index.js"></script>
</body>
</html>
