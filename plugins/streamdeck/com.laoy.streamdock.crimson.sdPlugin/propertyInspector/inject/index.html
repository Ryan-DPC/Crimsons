<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Crimson - Runes Property Inspector</title>
    <link href="../utils/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="sdpi-wrapper p-2">
        <div class="mb-3">
            <label class="form-label" style="font-weight: 600; font-size: 0.85rem; letter-spacing: 0.5px; color: #a0a0b0; text-transform: uppercase;">Emplacement du Build</label>
            <select class="form-select" id="buildIndex">
                <option value="1">Rune Build 1</option>
                <option value="2">Rune Build 2</option>
                <option value="3">Rune Build 3</option>
            </select>
            <div class="form-text text-muted mt-2">Choisissez quel build (1, 2 ou 3) ce bouton va injecter automatiquement dans League of Legends.</div>
        </div>
    </div>

    <script src="../utils/bootstrap.bundle.min.js"></script>
    <script src="../utils/common.js"></script>
    <script src="../utils/action.js"></script>
    <script src="index.js"></script>
</body>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        padding: 4px;
        background-color: #1a1a1f;
        color: #fff;
    }
    ::-webkit-scrollbar {
        display: none;
    }
    .form-select {
        background-color: #2b2b36;
        border-color: #3b3b4a;
        color: #fff;
        border-radius: 6px;
        font-size: 0.9rem;
        padding: 0.5rem;
    }
    .form-select:focus {
        background-color: #2b2b36;
        border-color: #d4af37; /* Gold accent */
        color: #fff;
        box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
    }
    .form-text {
        color: #8c8c9e !important;
        font-size: 0.78rem;
        line-height: 1.35;
    }
</style>
</html>
