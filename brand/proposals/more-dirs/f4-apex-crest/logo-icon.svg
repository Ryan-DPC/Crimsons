<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Crimsons Apex Crest">
  <title>Crimsons - F4 Apex Crest</title>
  <defs>
    <linearGradient id="f4g" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#FF4D62"/>
      <stop offset="45%" stop-color="#C81E36"/>
      <stop offset="100%" stop-color="#5C0E18"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="#121216"/>
  <!-- Minimal gaming crest: three peaks + base - no jewels, no clipart -->
