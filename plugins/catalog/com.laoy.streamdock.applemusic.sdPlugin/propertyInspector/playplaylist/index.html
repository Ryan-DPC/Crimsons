<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Apple Music — Play Playlist</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1a1a1f;
      color: #eee;
      font-size: 12px;
    }
    .wrap { display: flex; flex-direction: column; gap: 8px; }
    label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9a9ab0;
    }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      background: #2b2b36;
      border: 1px solid #3b3b4a;
      border-radius: 6px;
      color: #fff;
      padding: 8px 10px;
      font-size: 13px;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #fc3c44;
      box-shadow: 0 0 0 2px rgba(252, 60, 68, 0.25);
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .row select, .row input { flex: 1; }
    button {
      border: 0;
      border-radius: 6px;
      background: #fc3c44;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 12px;
      white-space: nowrap;
    }
    button.secondary {
      background: #2b2b36;
      border: 1px solid #3b3b4a;
      color: #ddd;
    }
    label.check {
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      color: #ddd;
      cursor: pointer;
    }
    .status {
      margin: 0;
      font-size: 11px;
      color: #8c8c9e;
      line-height: 1.4;
    }
    .status.ok { color: #6f6; }
    .status.err { color: #fc9aa0; }
    .hint {
      margin: 0;
      font-size: 11px;
      line-height: 1.45;
      color: #8c8c9e;
    }
    details {
      margin-top: 4px;
      color: #9a9ab0;
    }
    details summary {
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    #tokenBox {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border: 1px solid #3b3b4a;
      border-radius: 8px;
      background: #15151a;
    }
    #tokenBox.visible { display: flex; }
  </style>
</head>
<body>
  <div class="wrap">
    <label for="playlistSelect">Playlist bibliothèque</label>
    <div class="row">
      <select id="playlistSelect">
        <option value="">Chargement…</option>
      </select>
      <button id="refresh" class="secondary" type="button" title="Actualiser">↻</button>
    </div>

    <label class="check">
      <input id="shuffle" type="checkbox" />
      Lancer en mode aléatoire
    </label>

    <p id="status" class="status">Connexion à Cider…</p>

    <div id="tokenBox">
      <label for="ciderToken">Jeton Cider (apptoken)</label>
      <div class="row">
        <input id="ciderToken" type="password" placeholder="Coller le jeton ici" autocomplete="off" />
        <button id="saveToken" type="button">OK</button>
      </div>
      <p class="hint">
        Cider → Settings → Connectivity → Manage External Application Access.
        Coche <strong>Library</strong> (+ Playback), génère le jeton, colle-le ici.
      </p>
    </div>

    <details>
      <summary>Coller une URL / ID manuellement</summary>
      <label for="playlistManual" style="margin-top:6px;display:block;">URL ou ID</label>
      <input id="playlistManual" type="text" placeholder="https://music.apple.com/…/playlist/… ou pl.u-…" autocomplete="off" />
    </details>
  </div>
  <script src="index.js"></script>
</body>
</html>
