[package]
name = "crimson-server"
version = "1.0.2"
edition = "2021"
build = "build.rs"

[[bin]]
name = "crimson-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.21.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rustls = "0.22"
http = "1.0"
base64 = "0.21"
clap = { version = "4", features = ["derive"] }
single-instance = "0.3"
ureq = { version = "2.9", features = ["native-tls"] }
native-tls = "0.2"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4.44"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.25"
ab_glyph = "0.2"
sysinfo = "0.30"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"         # Optimize for size
lto = "fat"             # Link-Time Optimization (full)
codegen-units = 1       # Slower compile, better optimization
panic = "abort"         # Strip unwinding code
strip = true            # Strip symbols
