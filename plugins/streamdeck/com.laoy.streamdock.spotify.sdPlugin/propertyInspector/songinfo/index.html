<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Spotify Controller - Song Info</title>
    <link rel="stylesheet" href="../utils/crimson.css">
</head>
<body>
<div class="sdpi-wrapper">
    <div class="status-pill">
        <div class="status-dot"></div>
        <span>Crimson Relay Active</span>
    </div>

    <div class="section-header">Format</div>
    <div class="sdpi-item">
        <div class="sdpi-item-label">Style</div>
        <select class="sdpi-item-value select" id="mode">
            <option value="title">Title</option>
            <option value="title-artist">Title - Artist</option>
            <option value="artist">Artist</option>
            <option value="artist-title">Artist - Title</option>
            <option value="uri">Track URI</option>
            <option value="url">URL</option>
        </select>
    </div>

    <button id="logoutBtn">Logout</button>
</div>
<script src="../utils/common.js"></script>
<script src="../utils/action.js"></script>
<script src="index.js"></script>
</body>
</html>
