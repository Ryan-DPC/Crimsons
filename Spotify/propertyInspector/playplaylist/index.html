<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Spotify - Play Playlist</title>
    <link rel="stylesheet" href="../utils/sdpi.css">
</head>
<body>
<div class="sdpi-wrapper">
    <div class="sdpi-item">
        <div class="sdpi-item-label">Playlist</div>
        <select class="sdpi-item-value select" id="uri">
            <option value="">Loading...</option>
        </select>
    </div>
    <div class="sdpi-item">
        <div class="sdpi-item-label">Appareil</div>
        <select class="sdpi-item-value select" id="deviceSelect">
            <option value="">Loading...</option>
        </select>
    </div>
    <div class="sdpi-item">
        <button class="sdpi-item-value" id="Actualiser">Actualiser</button>
    </div>
    <div class="sdpi-item">
        <button class="sdpi-item-value" id="DconnexionBtn" style="background:#c0392b">Deconnexion</button>
    </div>
</div>
<script src="../utils/common.js"></script>
<script src="../utils/action.js"></script>
<script src="index.js"></script>
</body>
</html>
