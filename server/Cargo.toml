[package]
name = "crimson-server"
version = "3.1.4"
edition = "2021"
build = "build.rs"

[[bin]]
name = "crimson-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "process"] }
tokio-tungstenite = { version = "0.21.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rustls = "0.22"
http = "1.0"
base64 = "0.21"
clap = { version = "4", features = ["derive"] }
single-instance = "0.3"
ureq = { version = "2.9", features = ["native-tls"] }
native-tls = "0.2"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4.44"
rusqlite = { version = "0.32.1", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.25"
ab_glyph = "0.2"
sysinfo = "0.30"
discord-presence = "0.5"
uuid = { version = "1", features = ["v4"] }
dashmap = "5.5"
lazy_static = "1.4"
urlencoding = "2.1"
rdev = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Win32 APIs (audio-session control, COM) are only used on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation"] }

[build-dependencies]
winres = "0.1"
