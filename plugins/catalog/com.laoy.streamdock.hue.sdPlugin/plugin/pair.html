<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appairage Philips Hue — StreamDock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #121214;
            color: #f4f4f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .bridge-graphic {
            width: 130px;
            height: 130px;
            background: #27272a;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid #3f3f46;
        }
        .hue-button {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #18181b;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            animation: pulse-ring 1.8s infinite;
        }
        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6);
            }
            70% {
                box-shadow: 0 0 0 18px rgba(56, 189, 248, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
            }
        }
        .success-icon {
            display: none;
            font-size: 50px;
            color: #22c55e;
        }
        h1 {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 13px;
            color: #a1a1aa;
            line-height: 1.5;
            max-width: 320px;
            margin-bottom: 20px;
        }
        .instruction-box {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #bae6fd;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .countdown {
            font-size: 12px;
            color: #71717a;
            font-weight: 500;
        }
        .btn-cancel {
            margin-top: 16px;
            background: transparent;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-cancel:hover {
            background: #27272a;
            color: #f4f4f5;
        }
    </style>
</head>
<body>
    <div id="bridgeGraphic" class="bridge-graphic">
        <div id="hueButton" class="hue-button"></div>
        <div id="successIcon" class="success-icon">✓</div>
    </div>

    <h1 id="titleText">Appairage Philips Hue</h1>
    <p id="descText">Appuyez sur le gros bouton rond au centre de votre pont physique Philips Hue.</p>

    <div id="instructionBox" class="instruction-box">
        👉 En attente de l'appui sur le pont...
    </div>

    <div id="timerText" class="countdown">Temps restant : 60s</div>
    <button class="btn-cancel" onclick="window.close()">Fermer</button>

    <script>
        const bridgeIp = localStorage.getItem("hue_bridge_ip") || "192.168.1.3";
        let countdown = 60;
        let paired = false;

        const timerEl = document.getElementById("timerText");
        const instBox = document.getElementById("instructionBox");
        const titleEl = document.getElementById("titleText");
        const descEl = document.getElementById("descText");
        const hueBtn = document.getElementById("hueButton");
        const successIcon = document.getElementById("successIcon");

        const interval = setInterval(async () => {
            if (paired) return;
            countdown--;
            timerEl.textContent = `Temps restant : ${countdown}s`;

            try {
                const resp = await fetch(`http://${bridgeIp}/api`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ devicetype: "crimsons#streamdock" })
                });
                const res = await resp.json();
                if (res && res[0] && res[0].success && res[0].success.username) {
                    paired = true;
                    clearInterval(interval);
                    const user = res[0].success.username;
                    localStorage.setItem("hue_username", user);

                    // Show success
                    hueBtn.style.display = "none";
                    successIcon.style.display = "block";
                    titleEl.textContent = "Pont Connecté !";
                    titleEl.style.color = "#4ade80";
                    descEl.textContent = "Vos lumières Philips Hue sont maintenant synchronisées avec StreamDock.";
                    instBox.textContent = "✅ Appairage réussi ! Fermeture...";
                    instBox.style.background = "rgba(34, 197, 94, 0.15)";
                    instBox.style.borderColor = "rgba(34, 197, 94, 0.3)";
                    instBox.style.color = "#4ade80";

                    // Notify opener / other windows
                    try {
                        window.opener?.postMessage({ type: "HUE_PAIRED", user: user }, "*");
                    } catch(e) {}

                    setTimeout(() => {
                        window.close();
                    }, 2200);
                    return;
                }
            } catch(e) {}

            if (countdown <= 0) {
                clearInterval(interval);
                instBox.textContent = "❌ Délai expiré. Veuillez réessayer.";
                instBox.style.background = "rgba(239, 68, 68, 0.15)";
                instBox.style.borderColor = "rgba(239, 68, 68, 0.3)";
                instBox.style.color = "#f87171";
            }
        }, 1100);
    </script>
</body>
</html>
